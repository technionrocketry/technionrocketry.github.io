name: Update rocketry feed
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_feed.py
      - name: Commit if changed
        run: |
          git config user.name "trc-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "feed: auto update" && git push
